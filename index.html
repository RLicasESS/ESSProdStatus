<!DOCTYPE html>
<html>
<head>
  <title>ESSProdStatus</title>
  <style>
    table {
      border-collapse: collapse;
      width: 60%;
      margin: 20px auto;
      font-family: Arial, sans-serif;
    }
    th, td {
      border: 1px solid #aaa;
      padding: 8px 12px;
      text-align: left;
    }
    th {
      background-color: #2c3e50;  /* Dark blue-gray header */
      color: white;
      font-weight: bold;
    }
    .status-running { color: green; font-weight: bold; }
    .status-error   { color: red; font-weight: bold; }
    .status-stopped { color: goldenrod; font-weight: bold; }
    .status-maint   { color: blue; font-weight: bold; }

  </style>
</head>
<body>
  <h2 style="text-align: center;">ESS PRODUCTION</h2>

<script>

  // Detect if current page is index.html (disable links here)
  const isIndexPage = window.location.pathname.includes("index.html");

  async function loadCSV() {
    const response = await fetch('ESSProd.csv?v=' + new Date().getTime());
    const text = await response.text();

    const rows = text.trim().split('\n').map(row => row.split(','));
    const table = document.createElement('table');

    rows.forEach((row, rowIndex) => {
      const nonEmptyCount = row.filter(cell => {
        const c = cell.trim().toUpperCase();
        return c !== '' && c !== 'NA';
      }).length;

      if (nonEmptyCount === 0) return;

      const tr = document.createElement('tr');
      const isHeader = rowIndex === 0;
      const isTesterOrHandlerRow = !isHeader && row.some(cell => /tester|handler/i.test(cell));

      row.forEach((cell, colIndex) => {
        let cellContent = cell;
        const c = cell.trim().toUpperCase();

        // ---------------------------------------------------------
        // CLICKABLE WORD "TESTER" (header row only)
        // Disable link when viewing index.html
        // ---------------------------------------------------------
        if (isHeader && c === "TESTER") {
          if (isIndexPage) {
            cellContent = "TESTER";
          } else {
            cellContent = `<a href="https://connect.raspberrypi.com/devices/60a5a481-6e1a-43b3-8fd6-95b26e95aca0" target="_blank">TESTER</a>`;
          }
        }

        // ---------------------------------------------------------
        // CLICKABLE HANDLER ENTRIES (data rows)
        // Links disabled on index.html
        // ---------------------------------------------------------
        if (!isHeader) {

          if (c === "CHROMA") {
            cellContent = isIndexPage
              ? "CHROMA"
              : `<a href="https://connect.raspberrypi.com/devices/5fabcfc7-1bf1-445b-bf3d-b3e285895c7e" target="_blank">CHROMA</a>`;
          }

          if (c === "NS-3") {
            cellContent = isIndexPage
              ? "NS-3"
              : `<a href="https://connect.raspberrypi.com/devices/462b197a-acdb-4c97-bc15-70ab73addc46" target="_blank">NS-3</a>`;
          }

          if (c === "NS-4") {
            cellContent = isIndexPage
              ? "NS-4"
              : `<a href="https://connect.raspberrypi.com/devices/66fa4727-e6b5-4a1a-855d-1f266270b950" target="_blank">NS-4</a>`;
          }

          if (c === "NS-5") {
            cellContent = isIndexPage
              ? "NS-5"
              : `<a href="https://connect.raspberrypi.com/devices/468fc957-7879-440e-b1ea-b7e7dfef37f6" target="_blank">NS-5</a>`;
          }
        }

        // ---------------------------------------------------------
        // CELL CREATION
        // ---------------------------------------------------------
        const cellElement = document.createElement(isHeader ? 'th' : 'td');
        cellElement.innerHTML = cellContent;
        cellElement.style.border = '1px solid #aaa';
        cellElement.style.padding = '8px';

        // COLUMN 0 formatting
        if (colIndex === 0) {
          cellElement.style.backgroundColor = isHeader ? '#2c3e50' : '#dff0d8';
          if (isHeader) {
            cellElement.style.color = 'white';
            cellElement.style.fontWeight = 'bold';
          }
        }

        // TESTER / HANDLER ROW highlighting
        if (isTesterOrHandlerRow && !isHeader) {
          cellElement.style.backgroundColor = '#fef2d0';
          cellElement.style.fontWeight = 'bold';
        }

        // ---------------------------------------------------------
        // STATUS COLOR CODING
        // ---------------------------------------------------------
        if (!isHeader) {
          const status = cell.trim().toLowerCase();

          if (status === "running") {
            cellElement.style.color = "green";
            cellElement.style.fontWeight = "bold";
          }
          if (status === "error") {
            cellElement.style.color = "red";
            cellElement.style.fontWeight = "bold";
          }
          if (status === "stopped") {
            cellElement.style.color = "goldenrod";
            cellElement.style.fontWeight = "bold";
          }
          if (status === "maint") {
            cellElement.style.color = "blue";
            cellElement.style.fontWeight = "bold";
          }
        }
        // ---------------------------------------------------------

        tr.appendChild(cellElement);
      });

      table.appendChild(tr);
    });

    const oldTable = document.querySelector('table');
    if (oldTable) oldTable.remove();
    document.body.appendChild(table);
  }

  window.onload = () => {
    loadCSV();
    setInterval(loadCSV, 60000);
  };

</script>


</body>
</html>
