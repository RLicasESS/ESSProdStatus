<!DOCTYPE html>
<html>
<head>
  <title>ESS PRODUCTION</title>
  <style>
    table {
      border-collapse: collapse;
      width: 60%;
      margin: 20px auto;
      font-family: Arial, sans-serif;
    }
    th, td {
      border: 1px solid #aaa;
      padding: 8px 12px;
      text-align: left;
    }
    th {
      background-color: #2c3e50;
      color: white;
      font-weight: bold;
    }
    a {
      color: #007bff;
      font-weight: bold;
      text-decoration: none;
    }
    a:hover { text-decoration: underline; }

    /* Loading progress bar (LOADING COUNTS / TOTAL IN) */
    .lc-wrap { display: flex; flex-direction: column; gap: 6px; }
    .lc-num  { font-weight: 600; }
    .prog {
      height: 12px;
      border: 1px solid #bbb;
      border-radius: 8px;
      background: #f2f2f2;
      overflow: hidden;
    }
    .prog > .bar {
      height: 100%;
      width: 0%;
      background: #2e7d32; /* green */
    }
    .lc-pct { font-size: 12px; color: #444; }
  </style>
</head>
<body>

<h2 id="pageTitle" style="text-align:center;">ESS PRODUCTION</h2>

<script>

  // (Also supports links.html if you keep it: links show automatically on that filename.)
  const page = (location.pathname.split('/').pop() || "index.html").toLowerCase();
  const params = new URLSearchParams(location.search);
  const showLinks = (params.get("links") === "1") || (page === "links.html");

  // Title: only clickable in links mode
  if (showLinks) {
    document.getElementById("pageTitle").innerHTML =
      `<a href="https://connect.raspberrypi.com/devices" target="_blank">ESS</a> PRODUCTION`;
  }

          const v = parseInt((r[c] || "").toString().replace(/,/g, "").trim(), 10);
          if (!Number.isNaN(v)) totalInByCol[c] = v;
        }
      }
    });

          }
