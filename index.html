<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>ESS PRODUCTION</title>
  <style>
    table {
      border-collapse: collapse;
      width: 60%;
      margin: 20px auto;
      font-family: Arial, sans-serif;
    }
    th, td {
      border: 1px solid #aaa;
      padding: 8px 12px;
      text-align: left;
    }
    th {
      background-color: #2c3e50;
      color: white;
      font-weight: bold;
    }
    a {
      color: #007bff;
      font-weight: bold;
      text-decoration: none;
    }
    a:hover { text-decoration: underline; }

    /* Progress bars */
    .lc-wrap { display: flex; flex-direction: column; gap: 6px; }
    .lc-num  { font-weight: 600; }
    .prog {
      height: 12px;
      border: 1px solid #bbb;
      border-radius: 8px;
      background: #f2f2f2;
      overflow: hidden;
    }
    .prog > .bar {
      height: 100%;
      width: 0%;
      background: #2e7d32;
    }
    .lc-pct { font-size: 12px; color: #444; }
  </style>
</head>

<body>
  <h2 id="pageTitle" style="text-align:center;">ESS PRODUCTION</h2>

  <script>
    // Links mode:
    //   normal:   https://.../ESSProdStatus/
    //   links on: https://.../ESSProdStatus/?links=1
    const params = new URLSearchParams(window.location.search);
    const showLinks = params.get("links") === "1";

    if (showLinks) {
      document.getElementById("pageTitle").innerHTML =
        `<a href="https://connect.raspberrypi.com/devices" target="_blank">ESS</a> PRODUCTION`;
    }

    const CSV_URL = new URL("ESSProd.csv", window.location.href).toString();

    // Cache of previous rows (to freeze numbers when STATUS=error)
    let prevRowsByLabel = null; // { LABEL: rowArray }

    function normLabel(s) {
      return (s || "").toString().trim().toUpperCase();
    }
    function toInt(s) {
      const v = parseInt((s || "").toString().replace(/,/g, "").trim(), 10);
      return Number.isNaN(v) ? null : v;
    }

    async function loadCSV() {
      try {
        const response = await fetch(
          CSV_URL + (CSV_URL.includes("?") ? "&" : "?") + "v=" + Date.now(),
          { cache: "no-store" }
        );
        if (!response.ok) return; // silent fail (no status line)

        const text = await response.text();
        const rows = text.trim().split('\n').map(r => r.split('\t').length > 1 ? r.split('\t') : r.split(','));

        // Build STATUS per column
        const statusRow = rows.find(r => normLabel(r[0]) === "STATUS") || [];
        const statusByCol = {};
        for (let c = 1; c < statusRow.length; c++) {
          statusByCol[c] = (statusRow[c] || "").toString().trim().toLowerCase();
        }

        // Build TOTAL IN per column (for LOADING COUNTS progress)
        const totalInRow = rows.find(r => normLabel(r[0]) === "TOTAL IN") || [];
        const totalInByCol = {};
        for (let c = 1; c < totalInRow.length; c++) {
          const v = toInt(totalInRow[c]);
          if (v !== null) totalInByCol[c] = v;
        }

        // Build TOTAL row array (for AUTO1 / TOTAL progress)
        const totalRow = rows.find(r => normLabel(r[0]) === "TOTAL") || [];

        // Freeze numeric rows when STATUS for that column is error
        // (Keeps last known numbers on the page while tester is in ERROR.)
        const freezeLabels = new Set(["TOTAL IN", "LOADING COUNTS", "TOTAL", "AUTO1", "AUTO2", "AUTO3"]);

        if (prevRowsByLabel) {
          for (const r of rows) {
            const label = normLabel(r[0]);
            if (!freezeLabels.has(label)) continue;

            const prevRow = prevRowsByLabel[label];
            if (!prevRow) continue;

            for (let c = 1; c < r.length; c++) {
              if ((statusByCol[c] || "") === "error") {
                const prevVal = prevRow[c];
                if (prevVal !== undefined && String(prevVal).trim() !== "") {
                  r[c] = prevVal; // freeze cell
                }
              }
            }
          }
        }

        // Build table
        const table = document.createElement('table');

        rows.forEach((row, rowIndex) => {
          const nonEmptyCount = row.filter(cell => {
            const cc = (cell || "").toString().trim().toUpperCase();
            return cc !== '' && cc !== 'NA';
          }).length;
          if (nonEmptyCount === 0) return;

          const tr = document.createElement('tr');
          const isHeader = rowIndex === 0;
          const isTesterOrHandlerRow = !isHeader && row.some(cell => /tester|handler/i.test((cell || "").toString()));

          row.forEach((cell, colIndex) => {
            let cellContent = (cell ?? "").toString();
            const c = cellContent.trim().toUpperCase();
            const rowLabel = normLabel(row[0]);
            const val = cellContent.trim();

            // Match your links.html behavior:
            // TESTER header becomes a link in links mode
            if (isHeader && c === "TESTER") {
              cellContent = showLinks
                ? `<a href="https://connect.raspberrypi.com/devices/60a5a481-6e1a-43b3-8fd6-95b26e95aca0" target="_blank">TESTER</a>`
                : "TESTER";
            }

            // Handler links (non-header rows only)
            if (!isHeader) {
              if (c === "CHROMA") {
                cellContent = showLinks
                  ? `<a href="https://connect.raspberrypi.com/devices/5fabcfc7-1bf1-445b-bf3d-b3e285895c7e" target="_blank">CHROMA</a>`
                  : "CHROMA";
              }
              if (c === "NS-3") {
                cellContent = showLinks
                  ? `<a href="https://connect.raspberrypi.com/devices/462b197a-acdb-4c97-bc15-70ab73addc46" target="_blank">NS-3</a>`
                  : "NS-3";
              }
              if (c === "NS-4") {
                cellContent = showLinks
                  ? `<a href="https://connect.raspberrypi.com/devices/66fa4727-e6b5-4a1a-855d-1f266270b950" target="_blank">NS-4</a>`
                  : "NS-4";
              }
              if (c === "NS-5") {
                cellContent = showLinks
                  ? `<a href="https://connect.raspberrypi.com/devices/468fc957-7879-440e-b1ea-b7e7dfef37f6" target="_blank">NS-5</a>`
                  : "NS-5";
              }
            }

            // VNC links (links mode; same as links.html — no isHeader gate)
            if (showLinks && c === "AP-1")   cellContent = `<a href="vnc://AP-1">AP-1</a>`;
            if (showLinks && c === "AP-2")   cellContent = `<a href="vnc://AP-2">AP-2</a>`;
            if (showLinks && c === "S100_1") cellContent = `<a href="vnc://S100-1">S100_1</a>`;
            if (showLinks && c === "S100_2") cellContent = `<a href="vnc://S100-2">S100_2</a>`;

            // LOADING COUNTS progress (LOADING COUNTS / TOTAL IN)
            if (!isHeader && rowLabel === "LOADING COUNTS" && colIndex > 0) {
              const loading = toInt(cell);
              const totalIn = totalInByCol[colIndex];
              if (loading !== null && totalIn && totalIn > 0) {
                let pct = (loading / totalIn) * 100;
                pct = Math.max(0, Math.min(100, pct));
                cellContent = `
                  <div class="lc-wrap">
                    <div class="lc-num">${loading.toLocaleString()}</div>
                    <div class="prog"><div class="bar" style="width:${pct.toFixed(1)}%"></div></div>
                    <div class="lc-pct">${pct.toFixed(1)}%</div>
                  </div>
                `;
              }
            }

            // AUTO1 progress (AUTO1 / TOTAL) — display AUTO1 number only
            if (!isHeader && (rowLabel === "AUTO1" || rowLabel === "AUTO 1") && colIndex > 0) {
              const auto1 = toInt(cell);
              const total = toInt(totalRow[colIndex]); // TOTAL row, same column
              if (auto1 !== null && total !== null && total > 0) {
                let pct = (auto1 / total) * 100;
                pct = Math.max(0, Math.min(100, pct));
                cellContent = `
                  <div class="lc-wrap">
                    <div class="lc-num">${auto1.toLocaleString()}</div>
                    <div class="prog"><div class="bar" style="width:${pct.toFixed(1)}%"></div></div>
                    <div class="lc-pct">${pct.toFixed(1)}%</div>
                  </div>
                `;
              }
            }

            const cellElement = document.createElement(isHeader ? 'th' : 'td');
            cellElement.innerHTML = cellContent;
            cellElement.style.border = '1px solid #aaa';
            cellElement.style.padding = '8px';

            // First column styling
            if (colIndex === 0) {
              cellElement.style.backgroundColor = isHeader ? '#2c3e50' : '#dff0d8';
              if (isHeader) {
                cellElement.style.color = 'white';
                cellElement.style.fontWeight = 'bold';
              }
            }

            // Tester/Handler row highlight
            if (isTesterOrHandlerRow && !isHeader) {
              cellElement.style.backgroundColor = '#fef2d0';
              cellElement.style.fontWeight = 'bold';
            }

            // Status colors
            if (!isHeader) {
              const status = (cell || "").toString().trim().toLowerCase();
              if (status === "running") { cellElement.style.color = "green"; cellElement.style.fontWeight = "bold"; }
              if (status === "error")   { cellElement.style.color = "red"; cellElement.style.fontWeight = "bold"; }
              if (status === "stopped") { cellElement.style.color = "goldenrod"; cellElement.style.fontWeight = "bold"; }
              if (status === "maint")   { cellElement.style.color = "blue"; cellElement.style.fontWeight = "bold"; }
            }

            tr.appendChild(cellElement);
          });

          table.appendChild(tr);
        });

        // Replace table
        const oldTable = document.querySelector('table');
        if (oldTable) oldTable.remove();
        document.body.appendChild(table);

        // Update previous cache AFTER rendering
        const newPrev = {};
