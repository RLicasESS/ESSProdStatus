<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>END LOT</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { font-family: Arial, sans-serif; margin: 12px; }
    .wrap { max-width: 900px; margin: 0 auto; }
    .card { border: 1px solid #ddd; border-radius: 16px; padding: 10px; background: #fff; }
    button{
      width: 100%;
      padding: 14px 16px;
      font-size: 20px;
      font-weight: 900;
      border-radius: 16px;
      border: 1px solid #666;
      background: #fff;
      margin-top: 10px;
      cursor: pointer;
    }
    .sub { font-size: 13px; color:#555; margin-top: 8px; white-space: pre-wrap; }
    .err { color:#b00020; font-weight:900; margin-top: 10px; white-space: pre-wrap; }
    canvas { width: 100%; height: auto; border-radius: 16px; background:#fff; }
    img { display:none; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <!-- Hidden raw screenshot (we draw it into canvas) -->
      <img id="handlerImg" alt="handler" />

      <!-- Final “photo-like” output -->
      <canvas id="outCanvas"></canvas>

      <button id="shareBtn">SHARE</button>
      <button id="downloadBtn">DOWNLOAD IMAGE</button>

      <div id="status" class="sub"></div>
      <div id="error" class="err" style="display:none;"></div>
    </div>
  </div>

  <script>
    const CSV_URL = "https://raw.githubusercontent.com/RLicasESS/ESSProdStatus/main/ESSProd.csv";

    const params = new URLSearchParams(location.search);
    const tester = (params.get("tester") || "").trim();
    const nextStep = (params.get("next") || "").trim();

    const $ = (id)=>document.getElementById(id);
    function setErr(msg){ $("error").style.display = msg ? "" : "none"; $("error").textContent = msg || ""; }
    function setStatus(msg){ $("status").textContent = msg || ""; }
    function norm(s){ return String(s ?? "").replace(/\r/g,"").trim().toUpperCase(); }
    function parseCSV(text){
      const lines = text.replace(/\r/g,"").trim().split(/\n/);
      if (!lines.length) return [];
      const delim = lines[0].includes("\t") ? "\t" : ",";
      return lines.map(l => l.split(delim));
    }
    function findRow(rows, label){
      const want = norm(label);
      return (rows || []).find(r => norm(r?.[0]) === want) || null;
    }
    function pickRow(rows, labels){
      for (const lb of labels){
        const r = findRow(rows, lb);
        if (r) return r;
      }
      return null;
    }
    function safeCell(row, c){ return row && c < row.length ? String(row[c] ?? "").trim() : ""; }
    function findColByTester(rows, tester){
      const header = rows?.[0] || [];
      const want = norm(tester);
      for (let c = 1; c < header.length; c++){
        if (norm(header[c]) === want) return c;
      }
      return -1;
    }

    function msgText(step){
      const doneLine = `Done ${tester} / ${step || "(no step)"}`;
      const nextLine = nextStep ? `Next ${nextStep}` : `Next (not set)`;
      return doneLine + "\n" + nextLine;
    }

    async function loadAndRender(){
      setErr("");
      if (!tester){
        setErr("Missing tester.\nExample: end_lot_share.html?tester=AP-1&next=RT1");
        return;
      }

      setStatus("Loading…");

      const resp = await fetch(CSV_URL + (CSV_URL.includes("?") ? "&" : "?") + "v=" + Date.now(), { cache: "no-store" });
      if (!resp.ok) throw new Error(`CSV fetch failed: ${resp.status} ${resp.statusText}`);
      const rows = parseCSV(await resp.text());
      if (!rows.length) throw new Error("CSV parsed empty");

      const col = findColByTester(rows, tester);
      if (col < 0) throw new Error(`Tester '${tester}' not found in ESSProd.csv header`);

      const handlerRow = pickRow(rows, ["HANDLER"]);
      const lotRow     = pickRow(rows, ["LOT NUMBER", "LOT", "LOT_ID"]);
      const prodRow    = pickRow(rows, ["PRODUCT", "PRODUCT NAME", "PRODUCT_NAME"]);
      const stepRow    = pickRow(rows, ["TEST STEP", "STEP", "CURRENT STEP"]);
      const tempRow    = pickRow(rows, ["TEMP", "TEMPERATURE", "TEMP(C)", "TEMP (C)"]);

      const handler = safeCell(handlerRow, col).toUpperCase();
      const lot     = safeCell(lotRow, col);
      const product = safeCell(prodRow, col);
      const step    = safeCell(stepRow, col);
      const temp    = safeCell(tempRow, col);

      if (!handler) throw new Error("HANDLER cell is blank for this tester.");

      const pngUrl = `https://raw.githubusercontent.com/RLicasESS/ESSProdStatus/main/${encodeURIComponent(handler)}.png?v=${Date.now()}`;
      const img = $("handlerImg");
      img.src = pngUrl;

      // wait for screenshot image
      await new Promise((resolve, reject)=>{
        img.onload = resolve;
        img.onerror = ()=>reject(new Error("Handler image failed to load: " + pngUrl));
      });

      // Build label lines
      const line1 = product || "(PRODUCT)";
      let line2 = lot || "(LOT)";
      if (temp && line2 && !/-(\d+(\.\d+)?)C$/i.test(line2) && /C$/i.test(temp)){
        line2 = `${line2}-${temp.replace(/\s+/g,"")}`;
      }
      const line3 = `${tester}-${step || "STEP"}`;

      // Render combined image into canvas
      const canvas = $("outCanvas");
      const ctx = canvas.getContext("2d");

      const W = 1200;
      const pad = 40;
      const labelH = 280;
      const imgMaxH = 700;

      const scale = Math.min(W / img.naturalWidth, imgMaxH / img.naturalHeight);
      const drawW = Math.round(img.naturalWidth * scale);
      const drawH = Math.round(img.naturalHeight * scale);

      const H = pad + drawH + pad + labelH + pad;
      canvas.width = W;
      canvas.height = H;

      // white background
      ctx.fillStyle = "#fff";
      ctx.fillRect(0,0,W,H);

      // screenshot centered
      const x = Math.round((W - drawW)/2);
      const y = pad;
      ctx.drawImage(img, x, y, drawW, drawH);

      // label box
      const boxY = y + drawH + pad;
      const boxX = pad;
      const boxW = W - pad*2;
      const boxH = labelH;

      ctx.strokeStyle = "#111";
      ctx.lineWidth = 6;
      ctx.strokeRect(boxX, boxY, boxW, boxH);

      ctx.fillStyle = "#111";
      ctx.textAlign = "center";

      ctx.font = "bold 64px Arial";
      ctx.fillText(line1, W/2, boxY + 90);

      ctx.font = "bold 58px Arial";
      ctx.fillText(line2, W/2, boxY + 160);

      ctx.font = "bold 58px Arial";
      ctx.fillText(line3, W/2, boxY + 235);

      setStatus(msgText(step));
    }

    async function shareImage(){
      setErr("");
      const canvas = $("outCanvas");
      if (!canvas.width) { setErr("Image not ready yet."); return; }

      const blob = await new Promise(resolve => canvas.toBlob(resolve, "image/png"));
      if (!blob) { setErr("Failed to create image."); return; }

      const file = new File([blob], `ENDLOT_${tester}.png`, { type: "image/png" });
      const text = $("status").textContent || "";

      // Web Share (iOS Safari supports this for files on most modern versions)
      if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({ title: "END LOT", text, files: [file] });
          return;
        } catch (e) {
          // user cancelled or share failed
          setErr("Share cancelled/failed. Use DOWNLOAD IMAGE then share from Photos.");
          return;
        }
      }

      // Fallback: show guidance
      setErr("Your browser can’t share files directly.\nTap DOWNLOAD IMAGE, then share the image from Photos.");
    }

    function downloadImage(){
      setErr("");
      const canvas = $("outCanvas");
      if (!canvas.width) { setErr("Image not ready yet."); return; }
      const a = document.createElement("a");
      a.download = `ENDLOT_${tester}_${Date.now()}.png`;
      a.href = canvas.toDataURL("image/png");
      a.click();
    }

    $("shareBtn").onclick = () => shareImage();
    $("downloadBtn").onclick = () => downloadImage();

    window.addEventListener("load", () => {
      loadAndRender().catch(e => setErr(String(e.message || e)));
    });
  </script>
</body>
</html>
