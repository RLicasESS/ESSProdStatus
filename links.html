<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ESSProdStatus - Links</title>

    <style>
        body {
            background-color: #111;
            font-family: Arial, sans-serif;
            color: white;
            margin: 0;
            padding: 0;
        }
        h1 {
            text-align: center;
            padding: 20px 0;
            margin: 0;
            color: #00eaff;
        }
        .row {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            margin: 20px auto;
            max-width: 1200px;
        }
        .item {
            background: #222;
            padding: 20px;
            border-radius: 10px;
            margin: 15px;
            width: 250px;
            text-align: center;
            color: #ffffff;
            font-size: 20px;
            border: 2px solid #00eaff;
            transition: 0.2s;
        }
        .item:hover {
            background: #00eaff;
            color: #000;
            cursor: pointer;
        }
        a {
            text-decoration: none;
            color: inherit;
        }
        .back {
            text-align: center;
            margin-top: 30px;
        }
        .back a {
            color: #00eaff;
            font-size: 18px;
        }
    </style>
</head>

<body>
    <h1>Useful Links</h1>

    <div class="row">
        <a href="https://google.com" target="_blank">
            <div class="item">Google</div>
        </a>

        <a href="https://github.com/rlicasess" target="_blank">
            <div class="item">GitHub</div>
        </a>

        <a href="index.html">
            <div class="item">ESSProdStatus Home</div>
        </a>

        <!-- Add more link blocks here -->
        <!-- Example: 
        <a href="NS-3.html"><div class="item">NS-3 Dashboard</div></a>
        -->
    </div>

    <div class="back">
        <a href="index.html">← Back to Home</a>
    </div>
</body>
</html>
