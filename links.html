    table {

    }

      border: 1px solid #aaa;
      padding: 8px 12px;
      text-align: left;

    th {
      background-color: #2c3e50; 
      color: white;
      font-weight: bold;
    }
    a.headerlink {
      color: #00eaff;
      text-decoration: none;
      font-weight: bold;
    }
    a.headerlink:hover {
      color: #ffffff;
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <h2 style="text-align: center;">ESS PRODUCTION</h2>

      const c = cell.trim().toUpperCase();
      return c !== '' && c !== 'NA';
